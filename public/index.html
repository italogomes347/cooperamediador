<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medidor Coopera</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="interface-container">

    <header class="document-header">
      <div class="header-top">
        
        <h1>Medidor Coopera</h1>
      </div>
      <p class="header-desc">Uma estimativa do consumo da casa e dos painéis solares necessários.</p>
    </header>

    <main>
      <section class="form-section">
        <h2>Entrada de Equipamentos</h2>
        <form id="form-aparelho">
          <div class="form-grid">
            <div class="field">
              <label for="nome">Identificação do Aparelho</label>
              <input id="nome" type="text" placeholder="Ex: Chuveiro Elétrico" required />
            </div>
            <div class="field">
              <label for="potencia">Potência Nominal (W)</label>
              <input id="potencia" type="number" step="1" min="1" max="10000" placeholder="5500" required />
            </div>
            <div class="field">
              <label for="horas">Tempo de Uso (h/dia)</label>
              <input id="horas" type="number" step="0.1" min="0" max="24" placeholder="0.5" required />
            </div>
            <div class="field">
              <label for="dias">Dias de Uso (mês)</label>
              <input id="dias" type="number" step="1" min="1" max="31" placeholder="30" required />
            </div>
          </div>
          <button type="submit" class="btn-action">REGISTRAR EQUIPAMENTO</button>
        </form>
      </section>

      <section class="data-section">
        <div class="data-header">
          <h2>Sua Lista de Equipamentos</h2>
          <button id="btn-simular" class="btn-execute">EXECUTAR</button>
        </div>
        <div class="list-container">
          <ul id="lista-aparelhos">
            <li class="list-empty">Nenhum equipamento na memória de cálculo.</li>
          </ul>
        </div>
        <p id="erro" class="error-log"></p>
      </section>

      <section id="resultado" class="report-section hidden">
      </section>

    </main>
    <footer class="terminal-footer">
      <p>direitos reservados &copy; 2026 Coopera Luz</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
